name: Apply MUSHIN Glass Web

on:
  push:
    paths:
      - '.github/workflows/mushin-glass-web.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MUSHIN font
        run: |
          curl -fsSL -A 'MUSHIN-Glass-Web' -o /tmp/mushin.zip https://modi.jpn.org/download/MODI_mushin_2021_1104.zip
          python3 -c "import zipfile;z=zipfile.ZipFile('/tmp/mushin.zip');n=[x for x in z.namelist() if x=='mushin.otf' or x.endswith('/mushin.otf')][0];open('mushin.otf','wb').write(z.read(n))"
      - name: Apply MUSHIN Glass
        run: |
          echo '' | base64 -d > /tmp/mushin_patch.py
          python3 /tmp/mushin_patch.py
      - name: Commit design
        run: |
          rm .github/workflows/mushin-glass-web.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mushin.otf mushin-icon.svg .github/workflows/mushin-glass-web.yml
          git commit -m "Apply MUSHIN Glass design system"
          git push
