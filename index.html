<style>

<script>
const MG_PALETTES={mono_light:['ブラック','#1A1A1A','#1A1A1A'],white:['ホワイト','#FFFFFF','#333333'],mono_dark:['グレー','#8C8C8C','#262626'],green:['グリーン','#5E8C6E','#2F5A44'],green_light:['薄い緑','#7FA98C','#2F5A44'],red_rose:['ピンク','#B2798C','#3A2A31'],olive_gray:['モスグレー','#5E6455','#2B2E27'],teal_gray:['モスグリーン','#556B3E','#2E3524'],moss_pink:['モスピンク','#8E5A6B','#3A2A31'],moss_red:['モスレッド','#8E4F4A','#3A2B29'],moss_black:['モスブラック','#3A3A3A','#262626'],red_night:['セージ','#8DA08B','#2B3129'],graphite:['チャコール','#4F555C','#262626'],slate:['スレート','#5A6672','#262626'],blue_sky:['ブルーグレー','#6B7C93','#2A323D'],blue_night:['ネイビー','#4B5566','#262C36'],mauve_gray:['モーヴ','#7E7286','#2E2A33'],sand_gray:['サンド','#A99A82','#38322A'],brown_latte:['テラコッタ','#A8796A','#3A2E28'],brown_cocoa:['ブラウン','#7A6558','#332A25']};
const MG_TEXT={black:['黒','#000000'],white:['白','#FFFFFF'],gray_light:['薄いグレー','#9E9E9E'],gray_dark:['濃いグレー','#424242'],red_dark:['濃い赤','#8E2F2F'],red_light:['薄い赤','#C97B7B'],pink_dark:['濃いピンク','#A3435F'],pink_light:['薄いピンク','#D89AAC'],green_dark:['濃い緑','#2F6B45'],green_light:['薄い緑','#7FA98C'],moss_gray_dark:['濃いモスグレー','#5E6455'],moss_gray_light:['薄いモスグレー','#9AA08F'],moss_green_dark:['濃いモスグリーン','#556B3E'],moss_green_light:['薄いモスグリーン','#8FA277'],brown_dark:['濃い茶色','#6F4A2A'],brown_light:['薄い茶色','#B08A63'],blue_dark:['濃い青','#2F4F8E'],blue_light:['薄い青','#7B90C4'],sky_dark:['濃い空色','#2F6E8E'],sky_light:['薄い空色','#7FAFC4']};
const mgHex=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const mgMix=(a,b,t)=>{a=mgHex(a);b=mgHex(b);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function mgLoad(){try{return Object.assign({palette:'green_light',text_color:'black',glass_opacity:72},JSON.parse(localStorage.getItem('mushin_glass')||'{}'))}catch(e){return {palette:'green_light',text_color:'black',glass_opacity:72}}}
function mgApply(){const c=mgLoad(),p=MG_PALETTES[c.palette]||MG_PALETTES.green_light,t=MG_TEXT[c.text_color]||MG_TEXT.black,r=document.documentElement.style,primary=p[1],fg=t[1],bg=mgMix(primary,'#FFFFFF',.82),band=mgMix(primary,bg,.70);r.setProperty('--primary',primary);r.setProperty('--text',fg);r.setProperty('--bg',bg);r.setProperty('--band',band);r.setProperty('--list',mgMix(primary,'#FFFFFF',.90));r.setProperty('--row',mgMix(primary,'#FFFFFF',.92));r.setProperty('--middle',mgMix(primary,bg,.45));r.setProperty('--aux',mgMix(p[2],bg,.45));r.setProperty('--glass',Math.max(35,Math.min(95,c.glass_opacity))/100);r.setProperty('--glass-soft',Math.max(35,Math.min(95,c.glass_opacity-14))/100);const theme=document.querySelector('meta[name=theme-color]');if(theme)theme.content='#436E6A';}
function mgInit(){const p=document.getElementById('mgPalette'),t=document.getElementById('mgText'),g=document.getElementById('mgGlass');if(!p||!t||!g)return;if(!p.options.length)Object.entries(MG_PALETTES).forEach(([id,v])=>p.add(new Option(v[0],id)));if(!t.options.length)Object.entries(MG_TEXT).forEach(([id,v])=>t.add(new Option(v[0],id)));const c=mgLoad();p.value=c.palette;t.value=c.text_color;g.value=c.glass_opacity;document.getElementById('mgGlassValue').textContent=c.glass_opacity+'%';}
function mgSave(){const c=mgLoad(),p=document.getElementById('mgPalette'),t=document.getElementById('mgText'),g=document.getElementById('mgGlass');if(p)c.palette=p.value;if(t)c.text_color=t.value;if(g)c.glass_opacity=+g.value;localStorage.setItem('mushin_glass',JSON.stringify(c));mgApply();}
mgApply();
const $=id=>document.getElementById(id);
const S=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){st('保存できませんでした')}};
const st=m=>$('st').textContent=m;
let cfg=Object.assign({dm:'deepseek-flash',gm:'gemini-3.1-flash-image',gm2:'gemini-3-pro-image'},S('cfg')||{});
if(cfg.gm=='gemini-2.5-flash-image'){cfg.gm='gemini-3.1-flash-image';W('cfg',cfg)}
let srcs=S('srcs')||[],styles=S('styles')||{},arts=S('arts')||[],cur=null,imgs={};
const ids=['dk','dm','gk','gm','gm2','wu','wn','wp'];
ids.forEach(i=>$(i).value=cfg[i]||'');
function saveCfg(){ids.forEach(i=>cfg[i]=$(i).value.trim());W('cfg',cfg);st('保存しました')}

const T=[['set','設定'],['mk','作成'],['ed','編集'],['im','写真'],['th','サムネ'],['ad','広告'],['hs','履歴'],['co','料金']];
function show(k){if(k=='co')costShow();T.forEach(([a])=>{$('s-'+a).classList.toggle('on',a==k);$('t-'+a).classList.toggle('on',a==k)})}
T.forEach(([a,b])=>{const e=document.createElement('button');e.id='t-'+a;e.textContent=b;e.onclick=()=>show(a);$('nv').appendChild(e)});

async function run(f,m){st(m||'処理中…');try{await f();st('完了')}catch(e){st('エラー: '+e.message)}}
/* APK化(Capacitor)したときは、ブラウザの制限を通らないネイティブ通信を使う */
async function nativeFetch(u,o){
  const H=window.Capacitor.Plugins.CapacitorHttp;
  const hd=Object.assign({},o.headers||{});let data=o.body;
  const bin=data instanceof Uint8Array;
  if(bin){let t='';for(let i=0;i<data.length;i+=8192)t+=String.fromCharCode.apply(null,data.subarray(i,i+8192));data=btoa(t)}
  const r=await H.request({url:u,method:o.method||'GET',headers:hd,data,dataType:bin?'file':undefined,responseType:'json'});
  return {ok:r.status>=200&&r.status<300,status:r.status,json:async()=>typeof r.data=='string'?JSON.parse(r.data):r.data};
}
const cfgHost=()=>{try{return new URL(cfg.wu).hostname}catch(e){return ''}};
async function jf(u,o){
  let r;try{r=await (window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp?nativeFetch(u,o):fetch(u,o))}catch(e){
    const h=new URL(u).hostname;
    if(navigator.onLine===false)throw new Error('オフラインです。接続を確認してください');
    if(h==cfgHost())throw new Error('WordPressに接続できません。URLの綴り・https・REST APIの有効化を確認してください。ブラウザの制限(CORS)で弾かれている場合は、プラグインでこのアプリの接続元を許可するか、アプリ(APK)化してください');
    throw new Error(h+' に接続できません。接続を確認してください。ブラウザの制限で弾かれている場合はアプリ(APK)化で解決します');
  }
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error?.message||j.message||r.status);
  return j;
}
async function ds(sys,user){
  if(!cfg.dk)throw new Error('DeepSeekのキーを設定してください');
  const j=await jf('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.dk},body:JSON.stringify({model:cfg.dm,max_tokens:8192,messages:[{role:'system',content:sys},{role:'user',content:user}]})});
  const us=j.usage||{};logUse({k:'ds',i:us.prompt_tokens||0,o:us.completion_tokens||0});
  return j.choices[0].message.content;
}
async function fetchUrl(u){
  if(!cfg.dk)throw new Error('DeepSeekのキーを設定してください');
  if(!/^https?:\/\/[^\s]+$/i.test(u))throw new Error('URLの形が正しくありません');
  let j;
  try{j=await jf('https://api.deepseek.com/v1/tools/fetch',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.dk},body:JSON.stringify({url:u})})}
  catch(e){throw new Error('URLの取得に失敗しました('+e.message+')。このサイトは取得できないか、ブラウザの制限の可能性があります。本文を貼り付けて使ってください')}
  const c=(j.content||'').trim();
  if(!c)throw new Error('本文が取れませんでした(取得を許可していないサイトかもしれません)。本文を貼り付けてください');
  logUse({k:'fe'});
  return {title:(j.title||'').trim(),content:c};
}

  const o=await ds('あなたは編集者です。','次の記事のHTMLに、画像を入れるのに適した位置へ [画像: 何を写した画像か1文] という目印をちょうど'+n+'個だけ挿入し、記事全体をHTMLのみで返してください。本文は一字も変えないでください。既に [画像: ...] がある場合はそれも数に含め、増やしすぎないでください。\n'+e);
  setEd(unfence(o));sv('画像位置をAIで決定');imgList();
},'画像の位置を決定中…')}
function adAuto(){run(async()=>{
  if(!ads.length)throw new Error('先に広告タブで広告コードを登録してください');
  const e=$('ed').value;if(!e.trim())throw new Error('先に記事を作ってください');
  const o=await ds('あなたは編集者です。','次の記事のHTMLに、広告を入れるのに自然な切れ目(見出しの前後など)へ [広告] という目印を2〜4個だけ挿入し、記事全体をHTMLのみで返してください。本文は一字も変えないでください。\n'+e);
  setEd(unfence(o));sv('広告位置をAIで決定');st('[広告] の目印を入れました。送信時に広告コードへ置き換わります');
},'広告の位置を決定中…')}
/* 目印の [広告] を実際の広告コードへ(登録が複数なら最近使った順に1つずつ使い回す) */
function fillAds(h){
  if(!h.includes(AD_MK))return h;
  const list=ads.slice().sort((a,b)=>(b.used||0)-(a.used||0));
  if(!list.length)return h.split(AD_MK).join('');
  let i=0;return h.split(AD_MK).map((x,k,arr)=>k<arr.length-1?x+adHtml(list[i++%list.length]):x).join('');
}

/* サムネイル(アイキャッチ)別枠 */
let thumbs=[],thumbSel=-1;
function thMake(){run(async()=>{
  const e=$('ed').value;if(!e.trim())throw new Error('先に記事を作ってください');
  const n=Math.max(1,+$('tn').value||1);
  const o=await ds('あなたは画像ディレクターです。','次の記事のアイキャッチ(横長16:9、文字は入れない)用に、異なる構図の画像生成プロンプトを日本語で'+n+'個、1行に1個ずつ、番号や記号なしで出力してください。\nタイトル:'+$('ti').value+'\n記事:\n'+e.replace(/<[^>]+>/g,' ').slice(0,3000));
  const ps=o.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,n);
  thumbs=ps.map(p=>({p,im:null}));thumbSel=-1;thList();
},'サムネイル案を作成中…')}
function thList(){
  const box=$('tl');box.textContent='';
  if(!thumbs.length){box.textContent='まだ案がありません';return}
  thumbs.forEach((t,i)=>{
    const d=document.createElement('div');d.className='c';
    const ta=document.createElement('textarea');ta.style.minHeight='56px';ta.value=t.p;ta.oninput=()=>t.p=ta.value;
    const sl=document.createElement('select');sl.style.cssText='width:auto;margin-right:6px';
    [['標準',cfg.gm],['高品質',cfg.gm2]].forEach(([n,v])=>{if(v){const o=document.createElement('option');o.value=v;o.textContent=n;sl.appendChild(o)}});
    const bt=document.createElement('button');bt.className='b';
    const pk=document.createElement('button');pk.className='b';
    const dv=document.createElement('div');
    const draw=()=>{dv.textContent='';bt.textContent=t.im?'作り直す':'生成';pk.textContent=thumbSel==i?'✔アイキャッチに使う':'アイキャッチにする';pk.style.display=t.im?'inline-block':'none';
      if(t.im){const im=document.createElement('img');im.src=`data:${t.im.mimeType};base64,${t.im.data}`;dv.appendChild(im)}};
    bt.onclick=()=>run(async()=>{t.im=await gem(t.p+'\n横長16:9、画像内に文字は入れない。',sl.value);draw()},'サムネイルを生成中…');
    pk.onclick=()=>{thumbSel=i;thList()};
    draw();d.append(ta,sl,bt,pk,dv);box.appendChild(d);
  });
}

/* 広告コード(中身は一切書き換えず、そのまま差し込む) */
let ads=S('ads')||[],aid=null,aSel=[0,0];
const isUrl=t=>/^https?:\/\/\S+$/.test(t.trim());
const adHtml=a=>isUrl(a.code)?`<a href="${esc(a.code.trim())}" target="_blank" rel="nofollow sponsored noopener">${esc(a.name||a.code.trim())}</a>`:a.code;
const adCat=a=>a.par?(a.par+(a.chi?' / '+a.chi:'')):'未分類';
const adHay=a=>(a.name+' '+a.tags.join(' ')+' '+adCat(a)+' '+a.code).toLowerCase();
function adFilter(q,cat){q=(q||'').toLowerCase().trim();return ads.filter(a=>(!cat||adCat(a).split(' / ')[0]==cat)&&(!q||adHay(a).includes(q)))}
function adCats(){const c=[...new Set(ads.map(a=>adCat(a).split(' / ')[0]))];
  const f=$('af'),v=f.value;f.innerHTML='<option value="">すべての分類</option>';c.forEach(x=>{const o=document.createElement('option');o.value=o.textContent=x;f.appendChild(o)});f.value=c.includes(v)?v:'';
  const P=[...new Set(ads.map(a=>a.par).filter(Boolean))],C=[...new Set(ads.map(a=>a.chi).filter(Boolean))];
  $('apl').innerHTML=P.map(x=>`<option value="${esc(x)}">`).join('');$('acl').innerHTML=C.map(x=>`<option value="${esc(x)}">`).join('')}
function adl(){const l=$('al');l.textContent='';
  const list=adFilter($('aq').value,$('af').value);
  if(!list.length){l.textContent=ads.length?'該当なし':'まだ登録がありません';return}
  list.forEach(a=>{const d=document.createElement('div');d.className='c';
    const t=document.createElement('b');t.textContent=a.name||'(無名)';
    const m=document.createElement('div');m.style.cssText='font-size:12px;color:var(--mu)';m.textContent=adCat(a)+(a.tags.length?'  #'+a.tags.join(' #'):'')+(isUrl(a.code)?'  [URL→リンク]':'');
    const e=document.createElement('button');e.className='b';e.textContent='編集';e.onclick=()=>{aid=a.id;$('an').value=a.name;$('ap').value=a.par;$('ac').value=a.chi;$('at').value=a.tags.join(',');$('ax').value=a.code;window.scrollTo(0,0)};
    const x=document.createElement('button');x.className='b';x.textContent='削除';x.onclick=()=>{if(confirm('削除しますか?')){ads=ads.filter(y=>y.id!=a.id);W('ads',ads);adCats();adl()}};
    d.append(t,m,e,x);l.appendChild(d)})}
function adSave(){const code=$('ax').value;if(!code.trim())return st('コードを入力してください');
  const o={id:aid||Date.now(),name:$('an').value.trim(),par:$('ap').value.trim(),chi:$('ap').value.trim()?$('ac').value.trim():'',tags:$('at').value.split(',').map(x=>x.trim()).filter(Boolean),code,used:0};
  const i=ads.findIndex(a=>a.id==aid);if(i>=0){o.used=ads[i].used||0;ads[i]=o}else ads.unshift(o);
  W('ads',ads);adClr();adCats();adl();st('登録しました')}
function adClr(){aid=null;['an','ap','ac','at','ax'].forEach(i=>$(i).value='')}
function adOpen(){const e=$('ed');aSel=[e.selectionStart,e.selectionEnd];$('pq').value='';popl();$('pop').style.display='block'}
function popl(){const l=$('pl');l.textContent='';
  const list=adFilter($('pq').value).sort((a,b)=>(b.used||0)-(a.used||0));
  if(!list.length){l.textContent='広告コードがありません(広告タブで登録)';return}
  list.forEach(a=>{const b=document.createElement('button');b.className='b';b.style.cssText+=';display:block;width:100%;text-align:left';
    b.textContent=(a.name||'(無名)')+'  ['+adCat(a)+']';
    b.onclick=()=>{const e=$('ed'),h=adHtml(a),at=aSel[0];
      setEd(e.value.slice(0,at)+'\n'+h+'\n'+e.value.slice(aSel[1]));
      a.used=(a.used||0)+1;W('ads',ads);$('pop').style.display='none';st('広告を挿入しました')};
    l.appendChild(b)})}
rst();rs();hist();adCats();adl();thList();show(cfg.dk?'mk':'set');

document.addEventListener('DOMContentLoaded',()=>{mgInit();mgApply();});
